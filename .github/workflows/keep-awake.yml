name: Keep WhatsApp Bot Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WhatsApp Bot Health Endpoint
        run: |
          if [ -z "${{ secrets.RENDER_BOT_URL }}" ]; then
            echo "WARNING: RENDER_BOT_URL secret is not set in GitHub repository secrets."
            echo "Please add RENDER_BOT_URL (e.g. https://your-bot.onrender.com) to your GitHub secrets."
            exit 1
          fi
          
          # Strip trailing slash if present
          URL=$(echo "${{ secrets.RENDER_BOT_URL }}" | sed 's/\/$//')
          
          echo "Pinging bot at: $URL/health"
          RESPONSE=$(curl -s -w "%{http_code}" "$URL/health" -o /dev/null)
          
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Bot is awake and healthy! ✅"
          else
            echo "Error: Received HTTP $RESPONSE from bot ❌"
            exit 1
          fi
