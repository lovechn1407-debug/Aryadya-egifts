name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  ping_render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://erp-whatsapp-bot.onrender.com/health
          echo "Render successfully pinged!"
